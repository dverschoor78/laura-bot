[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "laura-bot"
version = "0.1.0"
description = "Bot Telegram para gestão de compras e pagamentos GGV"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Bot Telegram — framework principal (job-queue: sincronização periódica com a Receita)
    "python-telegram-bot[job-queue]==22.*",

    # Claude API — extração inteligente de documentos
    "anthropic>=0.111.0",

    # Validação de dados extraídos
    "pydantic>=2.0",

    # Variáveis de ambiente
    "python-dotenv>=1.0",

    # Logs simples e poderosos
    "loguru>=0.7",

    # Leitura de .docx (usado por scripts/import_fornecedores.py) — bot.py gera só PDF, não Word
    "python-docx>=0.8",

    # Renderização de HTML -> PDF (Pedido de Compra, recibo)
    "playwright>=1.40",

    # Manipulação de Excel (.xlsx)
    "openpyxl>=3.1",

    # Extração de texto de PDFs com texto embutido
    "pdfplumber>=0.10",

    # Manipulação de imagens (pré-processamento)
    "Pillow>=10.0",

    # Valor por extenso (recibo em PIX/parcela) — pt_BR já validado contra modelo real
    "num2words>=0.5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
